# ========================================
# Nav2 senza mappa — configurato per rover/*
# ========================================

controller_server:
  ros__parameters:
    use_sim_time: True
    base_frame_id: rover/base_link
    odom_frame_id: rover/odom
    global_frame_id: rover/map
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom/wheels
    progress_checker_plugin: "progress_checker"
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: True
      transform_tolerance: 0.2
      rotate_to_heading_angular_vel: 0.5
      allow_reversing: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: rover/map
      robot_base_frame: rover/base_link
      rolling_window: True
      width: 6          # ✅ int, non float
      height: 6         # ✅ int, non float
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
    global_frame: rover/map
    robot_base_frame: rover/base_link

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: rover/map
      robot_base_frame: rover/base_link
      resolution: 0.05
      width: 10         # ✅ int
      height: 10        # ✅ int
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: rover/map
    robot_base_frame: rover/base_link
    # forza il BT per NavToPose
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_time.xml"
    # forza il BT per NavThroughPoses (senza recovery)
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_poses_w_replanning_time.xml"
    # (facoltativo) disattiva l’uso del BT “through poses” se vuoi
    use_nav_through_poses: False
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node




